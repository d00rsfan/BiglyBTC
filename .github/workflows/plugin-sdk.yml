name: Native plugin SDK contract
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arguments: -G Ninja -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          - runner: macos-26
            arguments: -G Ninja
          - runner: windows-2025
            arguments: -A x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the SDK contract
        env:
          CMAKE_ARGUMENTS: ${{ matrix.arguments }}
        run: |
          read -r -a arguments <<< "$CMAKE_ARGUMENTS"
          # Use a checkout-relative build path on both Linux and Windows.
          cmake -S plugin-sdk -B sdk-build "${arguments[@]}" -DCMAKE_BUILD_TYPE=Release
          cmake --build sdk-build --config Release --parallel 2
          ctest --test-dir sdk-build -C Release --no-tests=error --output-on-failure
      - name: Build and test the application core
        if: runner.os != 'Linux'
        env:
          CMAKE_ARGUMENTS: ${{ matrix.arguments }}
        run: |
          set -euo pipefail
          read -r -a arguments <<< "$CMAKE_ARGUMENTS"
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew list --versions boost >/dev/null || brew install boost
            arguments+=("-DCMAKE_CXX_COMPILER=/usr/bin/clang++" "-DCMAKE_PREFIX_PATH=$(brew --prefix boost)")
          fi
          cmake -S preview/native/core -B native-core-build "${arguments[@]}" \
            -DCMAKE_BUILD_TYPE=Release -DBIGLYBTC_CORE_TESTS=ON
          cmake --build native-core-build --config Release --parallel 2
          ctest --test-dir native-core-build -C Release --no-tests=error --output-on-failure
