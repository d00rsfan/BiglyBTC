name: Profile lock compatibility

on:
  push:
    branches: [master, port/profile-lock]
    paths:
      - .github/workflows/platform-profile-lock.yml
      - preview/native/CMakeLists.txt
      - preview/native/platform/**
      - preview/native/adapters/**
      - preview/native/tests/original_control_tests.cpp
  pull_request:
    paths:
      - .github/workflows/platform-profile-lock.yml
      - preview/native/CMakeLists.txt
      - preview/native/platform/**
      - preview/native/adapters/**
      - preview/native/tests/original_control_tests.cpp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-lock:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arguments: -G Ninja
          - runner: ubuntu-26.04-arm
            arguments: -G Ninja
          - runner: macos-26
            arguments: -G Ninja
          - runner: windows-2025
            arguments: -A x64
          - runner: windows-11-arm
            arguments: -A ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: microsoft
          java-version: '21'
      - name: Check Java and native profile lock exclusion
        shell: bash
        env:
          CMAKE_ARGUMENTS: ${{ matrix.arguments }}
        run: |
          set -euo pipefail
          read -r -a arguments <<< "$CMAKE_ARGUMENTS"
          if [[ $RUNNER_OS == macOS ]]; then
            brew list --versions boost >/dev/null || brew install boost
            arguments+=("-DCMAKE_PREFIX_PATH=$(brew --prefix boost)")
          fi
          cmake -S preview/native/platform -B profile-lock-build "${arguments[@]}" -DCMAKE_BUILD_TYPE=Release
          cmake --build profile-lock-build --config Release --parallel 2
          ctest --test-dir profile-lock-build -C Release --no-tests=error --verbose
      - name: Compile the production profile adapters on macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew list --versions openssl@3 >/dev/null || brew install openssl@3
          cmake -S preview/native -B profile-adapters-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$(brew --prefix boost);$(brew --prefix openssl@3)"
          cmake --build profile-adapters-build --target biglybtc_profile biglybtc_mainline_checkpoint --parallel 3
