name: Desktop release packages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a prerelease when running from master
        type: boolean
        default: false
      maintainer:
        description: Actual package maintainer, Name <email>
        type: string
        default: 'd00rsfan <d00rsfan@users.noreply.github.com>'

permissions:
  contents: read

jobs:
  package:
    # Explicit GA label: https://github.com/actions/runner-images/issues/14747
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        qt: [bundled-qt, system-qt]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
          - qt: bundled-qt
            bundle: 'ON'
          - qt: system-qt
            bundle: 'OFF'
    env:
      BIGLYBTC_PACKAGE_CONTACT: ${{ inputs.maintainer || 'd00rsfan <d00rsfan@users.noreply.github.com>' }}
      BIGLYBTC_QT_VARIANT: ${{ matrix.qt }}
      BIGLYBTC_QT_BUNDLE: ${{ matrix.bundle }}
      BIGLYBTC_PACKAGE_ARCH: ${{ matrix.arch }}
      QT_QPA_PLATFORM: offscreen
      BIGLYBTC_UPDATE_PUBLIC_KEY: ${{ matrix.arch == 'amd64' && vars.BIGLYBTC_AZLOCPROV_UPDATE_PUBLIC_KEY || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the complete application source export
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, subprocess
          expected_arch = os.environ["BIGLYBTC_PACKAGE_ARCH"]
          actual_arch = subprocess.check_output(["dpkg", "--print-architecture"], text=True).strip()
          if actual_arch != expected_arch:
              raise SystemExit(f"Expected a native {expected_arch} runner, got {actual_arch}")
          checkout = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          source = checkout / "preview" if (checkout / "preview/native/CMakeLists.txt").is_file() else checkout
          required = ["LICENSE", "native/CMakeLists.txt", "native/engine/local_session.cpp",
              "native/app/main.cpp", "native/ui/library_window.cpp", "native/core/CMakeLists.txt",
              "native/adapters/CMakeLists.txt", "native/packaging/Debian.cmake"]
          missing = [name for name in required if not (source / name).is_file()]
          if missing:
              raise SystemExit("Application sources are not exported at this revision; an SDK/core-only "
                  "checkout cannot build an application DEB. Missing: " + ", ".join(missing))
          suffix = "-".join((os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"], expected_arch, os.environ["BIGLYBTC_QT_VARIANT"]))
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / ("biglybtc-debs-" + suffix)
          output.mkdir()
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("BIGLYBTC_PREVIEW_ROOT=" + str(source) + "\n")
              env.write("BIGLYBTC_PACKAGE_BUILD=" + str(output / "build") + "\n")
              env.write("BIGLYBTC_PACKAGE_OUTPUT=" + str(output) + "\n")
              env.write("BIGLYBTC_DEPENDENCY_ROOT=" + str(pathlib.Path(os.environ["RUNNER_TEMP"]) / ("biglybtc-dependencies-" + suffix)) + "\n")
          PYCODE
      - name: Provision hosted dependencies
        run: bash migration/tools/hosted_preview_dependencies.sh --install "$BIGLYBTC_QT_VARIANT" "$BIGLYBTC_DEPENDENCY_ROOT"
      - name: Build the daily's torrent SDK for the runner architecture
        run: |
          set -o pipefail
          bash migration/tools/build_release_runtime.sh "$BIGLYBTC_DEPENDENCY_ROOT/release-runtime" \
            2>&1 | tee "$BIGLYBTC_PACKAGE_OUTPUT/release-sdk-build.log"
      - name: Check packaging policies
        run: python3 "$BIGLYBTC_PREVIEW_ROOT/native/packaging/test_packaging.py"
      - name: Check private Qt relocation
        if: matrix.bundle == 'ON'
        run: |
          python3 "$BIGLYBTC_PREVIEW_ROOT/native/packaging/test_qt_bundle.py" \
            --sdk "$BIGLYBTC_QT_PREFIX" --output "$BIGLYBTC_PACKAGE_OUTPUT/qt-relocation.json"
      - name: Configure development variant
        run: |
          set -o pipefail
          nice -n 5 cmake -S "$BIGLYBTC_PREVIEW_ROOT/native" -B "$BIGLYBTC_PACKAGE_BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_COMPILER=$BIGLYBTC_CXX" \
            -DCMAKE_INSTALL_PREFIX=/usr -DBIGLYBTC_INSTALL_CORE=OFF \
            -DBIGLYBTC_LOCAL_ENGINE=ON -DBIGLYBTC_DESKTOP=ON -DBIGLYBTC_DEB=ON \
            "-DBIGLYBTC_BUNDLE_QT=$BIGLYBTC_QT_BUNDLE" \
            "-DBIGLYBTC_DEB_CONTACT=$BIGLYBTC_PACKAGE_CONTACT" \
            "-DBIGLYBTC_PACKAGE_BUILD_NUMBER=$GITHUB_RUN_NUMBER" \
            "-DBIGLYBTC_AZLOCPROV_UPDATE_PUBLIC_KEY=$BIGLYBTC_UPDATE_PUBLIC_KEY" \
            "-DCMAKE_PREFIX_PATH=$BIGLYBTC_QT_PREFIX;$BIGLYBTC_RELEASE_SDK_INSTALL;/usr" \
            "-DLibtorrentRasterbar_DIR=$BIGLYBTC_RELEASE_SDK_INSTALL/lib/cmake/LibtorrentRasterbar" \
            "-DBIGLYBTC_RELEASE_SDK_SOURCE=$BIGLYBTC_RELEASE_SDK_SOURCE" \
            "-DBIGLYBTC_SHARED_UDP_LIBRARY=$BIGLYBTC_RELEASE_SDK_LIBRARY" \
            "-DBIGLYBTC_MSGSYNC_SIGNER_SOURCE_DIR=$BIGLYBTC_RELEASE_MSGSYNC_SOURCE" \
            "-DBIGLYBTC_MLDHT_IDENTITY_SOURCE_DIR=$BIGLYBTC_RELEASE_MLDHT_SOURCE" \
            "-DBIGLYBTC_RELEASE_GEOIP=$BIGLYBTC_RELEASE_GEOIP" \
            "-DBIGLYBTC_PERSISTENT_NEGATIVE_LT_LIBRARY=/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/libtorrent-rasterbar.so.2.0" \
            2>&1 | tee "$BIGLYBTC_PACKAGE_OUTPUT/configure.log"
      - name: Build application and run packaging regressions
        run: |
          set -o pipefail
          targets=(BiglyBTC BiglyBTC-headless biglybtc-navigation-tests
            biglybtc-plugin-release-catalogue-tests biglybtc-plugin-release-transport-tests
            biglybtc-managed-inventory-batch-tests biglybtc-runtime-binding-driver biglybtc-persistent-session-tests
            biglybtc-ordinary-daily-host-tests biglybtc-mainline-single-udp-tests
            biglybtc-shared-udp-tests biglybtc-general-chat-service-tests biglybtc-sdk-tag-rate-group-tests)
          tests='classic-view-navigation|managed-inventory-batch|native-plugin-signed-(release-catalogue|https-transport)'
          # The signed module archive/trial channel accepts x86-64 ELF only.
          if [[ $BIGLYBTC_PACKAGE_ARCH == amd64 ]]; then
            targets+=(biglybtc-plugin-release-bundle-tests biglybtc-native-plugin-desktop-tests)
            tests+='|desktop-native-signed-plugin-updates|native-plugin-signed-release-bundle|native-signed-plugin-(release-trial|version-slot|atomic-activation)'
          fi
          nice -n 5 cmake --build "$BIGLYBTC_PACKAGE_BUILD" --parallel "$(nproc)" --target "${targets[@]}" \
            2>&1 | tee "$BIGLYBTC_PACKAGE_OUTPUT/build.log"
          ctest --test-dir "$BIGLYBTC_PACKAGE_BUILD" --no-tests=error --output-on-failure \
            -R "^($tests)$" 2>&1 | tee "$BIGLYBTC_PACKAGE_OUTPUT/unit-tests.log"
          status=0
          for test in persistent-runtime-source-bound persistent-runtime-reject-same-version-distro \
            persistent-native-peer-session ordinary-normal-daily-discovery mainline-single-udp \
            chat-shared-sdk-udp general-chat-relocated-sdk general-chat-profile-publication \
            actual-sdk-shared-tag-rate-upload actual-sdk-shared-tag-rate-download; do
            ctest --test-dir "$BIGLYBTC_PACKAGE_BUILD" --no-tests=error --output-on-failure \
              -R "^$test$" 2>&1 | tee -a "$BIGLYBTC_PACKAGE_OUTPUT/release-runtime-tests.log" || status=1
          done
          test "$status" -eq 0
      - name: Package and audit
        run: |
          set -o pipefail
          nice -n 5 cpack --config "$BIGLYBTC_PACKAGE_BUILD/CPackConfig.cmake" -B "$BIGLYBTC_PACKAGE_OUTPUT" \
            2>&1 | tee "$BIGLYBTC_PACKAGE_OUTPUT/cpack.log"
          python3 "$BIGLYBTC_PREVIEW_ROOT/native/packaging/audit_deb.py" "$BIGLYBTC_PACKAGE_OUTPUT"/*.deb \
            --application --architecture "$BIGLYBTC_PACKAGE_ARCH" \
            --release-sdk "$BIGLYBTC_PACKAGE_BUILD/engine/runtime-binding/release-sdk.json" \
            --output "$BIGLYBTC_PACKAGE_OUTPUT/package-audit.json"
          git rev-parse HEAD > "$BIGLYBTC_PACKAGE_OUTPUT/source-revision.txt"
          cp "$BIGLYBTC_DEPENDENCY_ROOT/installed-packages.tsv" "$BIGLYBTC_PACKAGE_OUTPUT/"
          cp "$BIGLYBTC_DEPENDENCY_ROOT/compiler.txt" "$BIGLYBTC_PACKAGE_OUTPUT/"
          if test -f "$BIGLYBTC_DEPENDENCY_ROOT/qt-archives-SHA256SUMS"; then
            cp "$BIGLYBTC_DEPENDENCY_ROOT/qt-archives-SHA256SUMS" "$BIGLYBTC_PACKAGE_OUTPUT/"
            cp "$BIGLYBTC_DEPENDENCY_ROOT/python-packages.txt" "$BIGLYBTC_PACKAGE_OUTPUT/"
          fi
      - name: Install and start the DEB in a clean Ubuntu image
        run: |
          set -euo pipefail
          packages=("$BIGLYBTC_PACKAGE_OUTPUT"/*.deb)
          test "${#packages[@]}" -eq 1
          docker run --rm --platform "linux/$BIGLYBTC_PACKAGE_ARCH" --mount "type=bind,source=${packages[0]},target=/tmp/package.deb,readonly" \
            --env DEBIAN_FRONTEND=noninteractive --env QT_QPA_PLATFORM=offscreen \
            ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db \
            bash -euo pipefail -c '
              apt-get update -qq
              legacy=$(mktemp -d /tmp/biglybtc-legacy-XXXXXX)
              mkdir -p "$legacy/DEBIAN" "$legacy/usr/bin"
              printf "%s\n" "Package: biglybtc-experimental" "Version: 0.1.0~dev.22" \
                "Architecture: $(dpkg --print-architecture)" "Maintainer: Packaging Fixture <fixture@example.invalid>" \
                "Description: Legacy package identity for upgrade smoke" > "$legacy/DEBIAN/control"
              printf "old payload\n" > "$legacy/usr/bin/BiglyBTC"
              dpkg-deb --build --root-owner-group "$legacy" /tmp/legacy.deb
              dpkg -i /tmp/legacy.deb
              apt-get install -qy --no-install-recommends /tmp/package.deb
              dpkg -s biglybtc | grep -Fx "Status: install ok installed"
              if dpkg -s biglybtc-experimental 2>/dev/null | grep -Fxq "Status: install ok installed"; then
                exit 1
              fi
              profile=$(mktemp -d /tmp/biglybtc-package-smoke-XXXXXX)
              export HOME="$profile"
              mkdir "$profile/active"
              printf de > "$profile/biglybt.config"
              printf d9:downloadslee > "$profile/downloads.config"
              mkdir -p "$profile/.biglybt/active"
              printf de > "$profile/.biglybt/biglybt.config"
              printf d9:downloadslee > "$profile/.biglybt/downloads.config"
              chown -R nobody:nogroup "$profile"
              runuser -u nobody -- env HOME="$profile" BiglyBTC --check-profile "$profile" | tee "$profile/check.json"
              grep -q METADATA_READABLE "$profile/check.json"
              status=0
              timeout 3s runuser -u nobody -- env HOME="$profile" BiglyBTC --experimental-local "$profile" 0 || status=$?
              test "$status" -eq 124
              status=0
              timeout 15s runuser -u nobody -- env HOME="$profile" BiglyBTC > "$profile/default-launch.log" 2>&1 || status=$?
              cat "$profile/default-launch.log"
              test "$status" -eq 124
              test -f "$profile/.biglybt/.azlock"
              grep -Fq "Library opening: ready" "$profile/default-launch.log"
              grep -Fq "Public chat transport: ready" "$profile/default-launch.log"
              echo "Installed BiglyBTC started the torrent engine and chat on the default profile"
            ' 2>&1 | tee "$BIGLYBTC_PACKAGE_OUTPUT/install-smoke.log"
      - name: Build and test relocatable Linux archive
        if: matrix.bundle == 'ON'
        run: |
          python3 "$BIGLYBTC_PREVIEW_ROOT/native/packaging/portable_linux.py" \
            "$BIGLYBTC_PACKAGE_OUTPUT"/*.deb "$BIGLYBTC_PACKAGE_OUTPUT"
      - name: Generate download checksums
        run: |
          cd "$BIGLYBTC_PACKAGE_OUTPUT"
          find . -maxdepth 1 -type f \( -name '*.deb' -o -name '*.tar.gz' \) -printf '%f\0' \
            | sort -z | xargs -0 -r sha256sum > SHA256SUMS
      - name: Stage verified release downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release-${{ matrix.arch }}-${{ matrix.qt }}
          overwrite: true
          path: |
            ${{ env.BIGLYBTC_PACKAGE_OUTPUT }}/*.deb
            ${{ env.BIGLYBTC_PACKAGE_OUTPUT }}/*.tar.gz
            ${{ env.BIGLYBTC_PACKAGE_OUTPUT }}/SHA256SUMS
            ${{ env.BIGLYBTC_PACKAGE_OUTPUT }}/source-revision.txt
          if-no-files-found: error
          retention-days: 14
      - name: Retain packages and failure diagnostics
        if: always() && env.BIGLYBTC_PACKAGE_OUTPUT != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-diagnostics-${{ matrix.arch }}-${{ matrix.qt }}
          overwrite: true
          path: |
            ${{ env.BIGLYBTC_PACKAGE_OUTPUT }}/*.json
            ${{ env.BIGLYBTC_PACKAGE_OUTPUT }}/*.txt
            ${{ env.BIGLYBTC_PACKAGE_OUTPUT }}/*.tsv
            ${{ env.BIGLYBTC_PACKAGE_OUTPUT }}/*.log
            ${{ env.BIGLYBTC_PACKAGE_BUILD }}/CMakeCache.txt
            ${{ env.BIGLYBTC_PACKAGE_BUILD }}/Testing/Temporary/
            ${{ env.BIGLYBTC_DEPENDENCY_ROOT }}/bootstrap.log
          if-no-files-found: error
          retention-days: 14

  macos:
    uses: ./.github/workflows/biglybtc-macos-dmg.yml

  windows:
    uses: ./.github/workflows/biglybtc-windows-zip.yml

  publish:
    needs: [package, macos, windows]
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-release-*
          path: packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-release-arm64
          path: packages/macos-release-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-release-*
          path: packages
      - name: Verify and publish the desktop downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir downloads
          version=
          for arch in amd64 arm64; do
            bundle=packages/linux-release-$arch-bundled-qt
            system=packages/linux-release-$arch-system-qt
            for variant in "$bundle" "$system"; do
              test "$(cat "$variant/source-revision.txt")" = "$GITHUB_SHA"
              (cd "$variant" && sha256sum --check --strict SHA256SUMS)
            done
            bundled_debs=("$bundle"/*_"$arch"_bundled-qt.deb)
            system_debs=("$system"/*_"$arch"_system-qt.deb)
            archives=("$bundle"/*-linux-"$arch".tar.gz)
            test "${#bundled_debs[@]}" -eq 1
            test "${#system_debs[@]}" -eq 1
            test "${#archives[@]}" -eq 1
            for deb in "${bundled_debs[0]}" "${system_debs[0]}"; do
              test "$(dpkg-deb --field "$deb" Package)" = biglybtc
              test "$(dpkg-deb --field "$deb" Architecture)" = "$arch"
              deb_version=$(dpkg-deb --field "$deb" Version)
              version=${version:-$deb_version}
              test "$deb_version" = "$version"
            done
            for asset in "${bundled_debs[0]}" "${system_debs[0]}" "${archives[0]}"; do
              name=${asset##*/}
              # GitHub normalizes tildes in asset names. Hash the published names.
              cp -- "$asset" "downloads/${name//\~/.}"
            done
          done
          macos=packages/macos-release-arm64
          test "$(cat "$macos/source-revision.txt")" = "$GITHUB_SHA"
          images=("$macos"/*-macos-arm64.dmg)
          test "${#images[@]}" -eq 1
          (cd "$macos" && sha256sum -- "${images[0]##*/}" | cmp - SHA256SUMS)
          cp -- "${images[0]}" "$bundle/source-revision.txt" downloads/
          for arch in x64 arm64; do
            windows=packages/windows-release-$arch
            test "$(tr -d '\r\n' < "$windows/source-revision.txt")" = "$GITHUB_SHA"
            archives=("$windows"/*-windows-"$arch".zip)
            test "${#archives[@]}" -eq 1
            (cd "$windows" && sha256sum -- "${archives[0]##*/}" | cmp - <(tr -d '\r' < SHA256SUMS))
            cp -- "${archives[0]}" downloads/
          done
          (cd downloads && sha256sum -- *.deb *.tar.gz *.dmg *.zip source-revision.txt > SHA256SUMS)

          tag="preview-$GITHUB_RUN_NUMBER"
          if release=$(gh release view "$tag" --json targetCommitish,isDraft,url); then
            jq -e --arg sha "$GITHUB_SHA" '.targetCommitish == $sha' <<< "$release" >/dev/null
            if jq -e '.isDraft' <<< "$release" >/dev/null; then
              gh release upload "$tag" downloads/* --clobber
              gh release edit "$tag" --title "BiglyBTC $version" --draft=false --latest=false
            else
              jq -r '.url' <<< "$release"
            fi
            exit 0
          fi
          gh release create "$tag" downloads/* --target "$GITHUB_SHA" \
            --title "BiglyBTC $version" --prerelease --latest=false --notes-file - <<EOF
          Desktop preview from \`$GITHUB_SHA\` for Ubuntu 26.04 amd64 and arm64, macOS arm64, and Windows x64 and arm64.

          All packages include the BiglyBTC build of libtorrent and DB-IP data for country and AS lookup. BiglyBTC uses the standard BiglyBT profile directory on each platform.

          - \`*_system-qt.deb\` uses shared libraries from Ubuntu. Install the required dependencies via \`sudo apt install --no-install-recommends ./<file>.deb\`. Add \`qt6-wayland\` for native Wayland support.
          - \`*_bundled-qt.deb\` supplies Qt and ICU privately.
          - \`*.tar.gz\` is the relocatable Linux build.
          - \`*-macos-arm64.dmg\` contains BiglyBTC.app for Apple silicon.
          - \`*-windows-*.zip\` contains the relocatable Windows build. Extract the archive and open \`bin/BiglyBTC.exe\`.

          [Build and installation tests]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          EOF
